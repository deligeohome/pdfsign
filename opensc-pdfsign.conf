# OpenSC configuration used ONLY by pdfsign (selected through $OPENSC_CONF).
# The Bit4id TokenME EVO v2 reports a "secure PIN entry" (pin pad) capability
# but has no keypad. Disabling it guarantees a PIN is always sent from software
# and that an empty PIN can never start a PIN-pad verification.
app default {
    reader_driver pcsc {
        enable_pinpad = false;
    }
}

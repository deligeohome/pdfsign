# pdfsign settings (non-secret). The password/PIN goes in credentials.ini.

[token]
# OpenSC PKCS#11 module: talks to the card directly through pcscd, no vendor middleware.
# "auto" searches the usual Debian/Ubuntu, Fedora, Arch and openSUSE locations.
pkcs11_module = auto
# How the signing key is unlocked:
#   password = alphanumeric password (SafeNet calls it "Token Password"), 4-16 ASCII characters
#   pin      = digits only
# Either way it is the secret of the card's "Digital Signature PIN" object (3 tries!).
secret_type = password
# Tries of a fresh signing PIN/password on your card (IDPrime 940 Digital Signature PIN: 3).
# The stored secret is used only while the counter equals this value.
full_tries = 3
# "auto" = the slot that holds the non-repudiation (signing) certificate.
# Otherwise give the token label, e.g.  My To... (Digital Signature PIN)
slot = auto

[tsa]
# RFC 3161 timestamp server. Default: qualified TSA of the Hellenic Public Administration CA (APED,
# free, no account). Alternatives: http://timestamp.digicert.com, https://freetsa.org/tsr, or your CA's TSA.
url = https://timestamp.aped.gov.gr/qtss

[signature]
# B-T   : signature + trusted timestamp
# B-LT  : + embedded certificate chain and OCSP/CRL (long-term validation)
# B-LTA : + document timestamp over everything (archival)
level = B-LT
reason =
location =
contact =
# Visible stamp text. %(signer)s = certificate name, %(ts)s = signing time
stamp_text = Digitally signed by
    %(signer)s
    Date: %(ts)s
timestamp_format = %Y-%m-%d %H:%M:%S %Z
# TrueType/OpenType font for the visible stamp (must contain Greek glyphs for Greek text).
# Must have 1000 units/em (pyHanko bug spaces out e.g. DejaVu); otherwise the built-in font is used.
# "auto" picks Noto Sans / FreeSans if installed.
font = auto
font_size = 9
# Frame around the stamp: auto = only for new boxes (existing form fields have their own frame),
# yes = always, no = never.
stamp_border = auto

[autolocate]
# Signature auto-location from the [identities] in credentials.ini.
# A signature field counts as "next to" your name if it is within field_radius points
# (horizontal distance weighs double). Otherwise a new box of box_width x box_height is
# proposed above / right / below / left of the name, avoiding other text.
field_radius = 120
box_width = 160
box_height = 50
